name: Check Sherlock Holmes Reservation

on:
  repository_dispatch:
    types: [check_reservation_trigger]
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 활성화
    inputs:
      limit_time:
        description: '테스트용 임계 시각 (형식: HH:MM, 예: 16:00). 평소에는 비워두면 기본 12:00이 적용되며, 12:00보다 늦은 시각을 입력할 경우 조기 종료 필터를 우회하여 실시간 오후 알람 테스트가 가능합니다. (수동 실행 시에는 요일 제한 없이 즉시 작동합니다)'
        required: false
        default: ''

jobs:
  check-reservation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Chromium & dependencies
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run monitoring script
      env:
        SHERLOCK_URL: ${{ secrets.SHERLOCK_URL || 'https://sherlock-holmes.co.kr/reservation/index.php?sido=12&bno=86#reservation' }}
        PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        EARLY_THRESHOLD_LIMIT: ${{ github.event.inputs.limit_time || secrets.EARLY_THRESHOLD_LIMIT || '12:00' }}
        PUSHOVER_SOUND: ${{ secrets.PUSHOVER_SOUND }}
        PUSHOVER_EXPIRE: ${{ secrets.PUSHOVER_EXPIRE }}
      run: |
        python src/main.py
