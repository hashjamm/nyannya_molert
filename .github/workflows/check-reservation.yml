name: Check Sherlock Holmes Reservation

on:
  schedule:
    # KST 매일 오전 8시, 9시, 10시 실행 (UTC: 전날 23시, 당일 0시, 1시)
    # GitHub Actions의 Cron은 UTC 기준입니다.
    - cron: '0 23,0,1 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 활성화

jobs:
  check-reservation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Chromium & dependencies
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run monitoring script
      env:
        SHERLOCK_URL: ${{ secrets.SHERLOCK_URL }}
        PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        EARLY_THRESHOLD_LIMIT: ${{ secrets.EARLY_THRESHOLD_LIMIT }}
        PUSHOVER_SOUND: ${{ secrets.PUSHOVER_SOUND }}
        PUSHOVER_EXPIRE: ${{ secrets.PUSHOVER_EXPIRE }}
      run: |
        python src/main.py
